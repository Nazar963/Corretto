<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Corretto fixture: fields</title></head>
<body>
  <textarea id="textarea" rows="6" cols="60"></textarea>
  <input id="text" type="text" size="60">
  <input id="search" type="search" size="60">
  <input id="after" type="text" size="60">

  <input id="password" type="password">
  <input id="email" type="email">
  <input id="tel" type="tel">
  <input id="url" type="url">
  <input id="number" type="number">
  <input id="readonly" type="text" readonly value="this field is read only text">
  <input id="cc" type="text" autocomplete="cc-number">
  <input id="otp" type="text" autocomplete="one-time-code">
  <input id="newpass" type="text" autocomplete="new-password">

  <div id="slot"></div>
  <iframe id="frame" src="/iframe.html" width="500" height="200"></iframe>
</body>
</html>
