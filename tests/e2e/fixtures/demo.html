<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New message</title>
  <style>
    body { margin: 0; background: #eef2f7; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #111827; }
    .window { width: 760px; margin: 60px auto; background: #fff; border-radius: 12px; box-shadow: 0 10px 40px rgb(15 23 42 / 0.15); overflow: hidden; }
    .bar { background: #1f2937; color: #fff; padding: 10px 16px; font-weight: 600; }
    .row { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid #e5e7eb; color: #4b5563; }
    .row span { color: #111827; }
    .body { min-height: 300px; padding: 16px; outline: none; white-space: pre-wrap; }
    .send { margin: 0 16px 16px; background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 8px 18px; font: inherit; font-weight: 600; }
  </style>
</head>
<body>
  <div class="window">
    <div class="bar">New message</div>
    <div class="row">To <span>sara@example.com</span></div>
    <div class="row">Subject <span>Quarterly report</span></div>
    <div id="body" class="body" contenteditable="true"></div>
    <button class="send" type="button">Send</button>
  </div>
</body>
</html>
